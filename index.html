<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Loop & Halting Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-200">
        <h1 class="text-3xl font-bold mb-2 border-b pb-4 text-slate-900">Infinite Loop & Halting Problem Analyzer</h1>
        <p class="text-slate-600 mb-8">Engineering workaround simulator: Static Ranking + Cycle Detection + Step-Bounded Watchdog.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-sm font-semibold mb-2">Select Target Program Loop</label>
                <select id="prog-selector" class="w-full p-3 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="countdown">1. Valid Countdown Loop (n=15, step=-3)</option>
                    <option value="modular">2. Modular Cycle Bug (x=(x+2)%4 != 0)</option>
                    <option value="stagnant">3. Stagnant Loop Bug (i=0, step=0)</option>
                    <option value="runaway">4. Runaway State Growth (n=1, step=+1)</option>
                    <option value="collatz">5. Collatz Sequence (n=27)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2">Watchdog Step Limit (K_max)</label>
                <div class="flex gap-2">
                    <input type="number" id="k-max" value="100" class="w-full p-3 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none font-mono">
                    <button onclick="runSimulation()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold transition-colors">Analyze</button>
                </div>
            </div>
        </div>

        <div id="results-container" class="hidden">
            <h2 class="text-xl font-bold mb-4">Analysis & Execution Report</h2>
            <div class="bg-slate-900 rounded-lg p-6 font-mono text-sm overflow-x-auto text-white space-y-4">
                <div>
                    <span class="text-slate-400">Tier 1 Static Analysis:</span>
                    <p id="static-result" class="text-yellow-400 font-semibold mt-1"></p>
                </div>
                <div>
                    <span class="text-slate-400">Runtime Execution Trace:</span>
                    <div id="trace-log" class="mt-2 space-y-1 max-h-48 overflow-y-auto text-xs text-slate-300 pr-2"></div>
                </div>
                <div class="border-t border-slate-700 pt-4 flex items-center justify-between">
                    <span class="text-slate-400">Final Verdict:</span>
                    <span id="final-verdict" class="px-4 py-2 rounded-lg font-bold text-lg"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const programs = {
            countdown: {
                static: "PROVEN TERMINATING: Monotonically decreasing ranking function f(n) = n bounded by 0.",
                run: (kMax) => {
                    let n = 15, steps = 0, logs = [];
                    while (n > 0 && steps < kMax) {
                        logs.push(`Step ${steps}: n = ${n}`);
                        n -= 3;
                        steps++;
                    }
                    logs.push(`Step ${steps}: n = ${n} (Loop guard failed)`);
                    return { verdict: "TERMINATED_NORMALLY", logs, status: "ok" };
                }
            },
            modular: {
                static: "INCONCLUSIVE: Non-monotonic modular arithmetic update.",
                run: (kMax) => {
                    let x = 1, steps = 0, logs = [], visited = new Set();
                    while (x !== 0 && steps < kMax) {
                        if (visited.has(x)) {
                            logs.push(`Step ${steps}: x = ${x} (EXACT STATE REPEATED!)`);
                            return { verdict: "INFINITE_LOOP_CYCLE", logs, status: "error" };
                        }
                        visited.add(x);
                        logs.push(`Step ${steps}: x = ${x}`);
                        x = (x + 2) % 4;
                        steps++;
                    }
                    return { verdict: "TERMINATED_NORMALLY", logs, status: "ok" };
                }
            },
            stagnant: {
                static: "WARNING: Statically detected step delta of 0 on active loop condition.",
                run: (kMax) => {
                    let i = 0, steps = 0, logs = [], visited = new Set();
                    while (i < 10 && steps < kMax) {
                        if (visited.has(i)) {
                            logs.push(`Step ${steps}: i = ${i} (State stagnated without change)`);
                            return { verdict: "INFINITE_LOOP_CYCLE", logs, status: "error" };
                        }
                        visited.add(i);
                        logs.push(`Step ${steps}: i = ${i}`);
                        steps++;
                    }
                    return { verdict: "INFINITE_LOOP_CYCLE", logs, status: "error" };
                }
            },
            runaway: {
                static: "INCONCLUSIVE: Step increases value away from termination bound.",
                run: (kMax) => {
                    let n = 1, steps = 0, logs = [];
                    while (n > 0 && steps < kMax) {
                        if (steps < 10 || steps >= kMax - 3) logs.push(`Step ${steps}: n = ${n}`);
                        else if (steps === 10) logs.push(`... [Skipping intermediate steps] ...`);
                        n += 1;
                        steps++;
                    }
                    logs.push(`Watchdog limit K_max=${kMax} hit without repeating state.`);
                    return { verdict: "WATCHDOG_TIMEOUT", logs, status: "timeout" };
                }
            },
            collatz: {
                static: "INCONCLUSIVE: Hailstone formulation (Unbounded non-monotonic space).",
                run: (kMax) => {
                    let n = 27, steps = 0, logs = [];
                    while (n > 1 && steps < kMax) {
                        if (steps < 8 || steps > 105) logs.push(`Step ${steps}: n = ${n}`);
                        else if (steps === 8) logs.push(`... [Evaluating 3n+1 sequence] ...`);
                        n = (n % 2 === 0) ? n / 2 : 3 * n + 1;
                        steps++;
                    }
                    logs.push(`Step ${steps}: n = ${n} (Reached base 1)`);
                    return { verdict: "TERMINATED_NORMALLY", logs, status: "ok" };
                }
            }
        };

        function runSimulation() {
            const key = document.getElementById('prog-selector').value;
            const kMax = parseInt(document.getElementById('k-max').value) || 100;
            const prog = programs[key];

            document.getElementById('results-container').classList.remove('hidden');
            document.getElementById('static-result').textContent = prog.static;

            const res = prog.run(kMax);
            const traceLog = document.getElementById('trace-log');
            traceLog.innerHTML = res.logs.map(l => `<div>${l}</div>`).join('');

            const verdictEl = document.getElementById('final-verdict');
            verdictEl.textContent = res.verdict;
            if (res.status === "ok") {
                verdictEl.className = "px-4 py-2 rounded-lg font-bold text-lg bg-green-600 text-white";
            } else if (res.status === "error") {
                verdictEl.className = "px-4 py-2 rounded-lg font-bold text-lg bg-red-600 text-white";
            } else {
                verdictEl.className = "px-4 py-2 rounded-lg font-bold text-lg bg-yellow-600 text-white";
            }
        }
    </script>
</body>
</html>
